# Release gate for the ChirpAuth Rust client, run on every vX.Y.Z tag.
#
# Today it only checks that the tagged tree passes its tests and shows what a
# crates.io publish would ship. Tags reach GitHub through the amber-git mirror
# (SOURCE.md), so there is no git mirror step here.
#
# Cargo.lock is gitignored (a library), so nothing here passes --locked: each
# run resolves dependencies afresh, as test.yml does.
name: release gate (crates.io publish parked)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: "tag or sha to check"
        required: true

permissions:
  contents: read

concurrency: publish-client-release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # --test-threads=2 as in test.yml: the verify-path tests' fake JWKS
      # servers race when run highly parallel (see the comment there).
      - name: Gate — tests must pass
        run: cargo test -- --test-threads=2

      - name: Dry-run — show exactly what a crates.io publish would ship
        run: cargo package --list

      # crates.io publishing is PARKED. To enable:
      # (1) publish `capability` to crates.io and give the dependency in
      #     Cargo.toml a version: `cargo package` refuses a git-only dependency
      #     ("dependency `capability` does not specify a version");
      # (2) set the CARGO_REGISTRY_TOKEN secret on this repo (crates.io API
      #     token, publish scope); (3) uncomment the step below.
      # NOTE: the first publish claims `chirp-auth-client` on crates.io publicly
      # and is irreversible — a deliberate decision, not an accident.
      # - name: Publish to crates.io
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: cargo publish
